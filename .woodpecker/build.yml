# Continuous build: unit tests + assembleDebug on push/PR to main.
# The release pipeline (.woodpecker/release.yml) handles tag builds —
# including the rootfs download and post-build APK injection, which
# need the 162MB gitignored rootfs.tar and are release-only concerns.
#
# Repos are private on Forgejo — server-side netrc injection does not work
# with this setup, so clone auth is explicit: CI_NETRC_* env sourced from
# the repo-level FORGE_CLONE_TOKEN secret.
clone:
  git:
    image: woodpeckerci/plugin-git
    environment:
      CI_NETRC_MACHINE: git.angussoftware.dev
      CI_NETRC_USERNAME: coda
      CI_NETRC_PASSWORD:
        from_secret: FORGE_CLONE_TOKEN

when:
  - event: [push, pull_request]
    branch: [main]

steps:
  build:
    image: localhost:5000/ci-theming-jdk23:latest
    commands:
      # Install Android SDK (required by AGP even for JVM-only steps)
      - |
        if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        else
          echo "Android SDK cached, skipping install"
        fi
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
        echo "sdk.dir=$ANDROID_HOME" > local.properties
      # rootfs.tar is gitignored (162MB) — asset merge needs it present.
      # Fetch the current build rootfs from the internal rootfs-source
      # release attachment. Leak-proof (PR #80 pattern, post-#287):
      # FORGEJO_TOKEN consumed ONLY via os.environ inside Python; zero
      # secret references in shell command text (set +x brackets do NOT
      # suppress the generator echo). Custom User-Agent — Forgejo
      # 403-blocks the default Python-urllib UA.
      - |
        cat > /tmp/fetch-rootfs.py << 'PYEOF'
        import json, os, shutil, sys, urllib.request
        TOKEN = os.environ.get('FORGEJO_TOKEN')
        if not TOKEN:
            print('FATAL: missing required env: FORGEJO_TOKEN', file=sys.stderr)
            sys.exit(1)
        HDRS = {'User-Agent': 'angus-ci/1.0', 'Authorization': 'token ' + TOKEN}
        API = 'https://git.angussoftware.dev/api/v1/repos/coda/agents-beamdown/releases/tags/internal%2Frootfs-source'
        try:
            req = urllib.request.Request(API, headers=HDRS)
            rel = json.load(urllib.request.urlopen(req, timeout=120))
            asset = rel['assets'][0]
            print('rootfs asset:', asset['name'])
            req = urllib.request.Request(asset['browser_download_url'], headers=HDRS)
            with urllib.request.urlopen(req, timeout=900) as r, \
                 open('app/src/main/assets/rootfs.tar', 'wb') as f:
                shutil.copyfileobj(r, f)
        except Exception as e:
            print(f'FATAL: rootfs fetch failed: {e}', file=sys.stderr)
            sys.exit(1)
        size = os.path.getsize('app/src/main/assets/rootfs.tar')
        print(f'rootfs.tar downloaded: {size} bytes')
        PYEOF
        python3 /tmp/fetch-rootfs.py
        ls -la app/src/main/assets/rootfs.tar
      - chmod +x gradlew
      - ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
    environment:
      GRADLE_USER_HOME: /root/.gradle
      ANDROID_HOME: /opt/android-sdk
      FORGEJO_TOKEN:
        from_secret: FORGEJO_TOKEN
    volumes:
      - gradle-cache-lettaenv:/root/.gradle/caches
      - gradle-wrapper-lettaenv:/root/.gradle/wrapper
      - android-sdk-lettaenv:/opt/android-sdk
